name: Build Windows EXE

on:
  workflow_dispatch:  # 手动触发
    inputs:
      version:
        description: "版本号（如 1.0.1）"
        required: false
        default: ""
  push:
    tags:
      - "v*"  # tag 推送时也触发

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt
        shell: cmd

      - name: Build EXE
        run: python build_exe.py
        shell: cmd

      - name: Verify EXE
        run: |
          if (Test-Path "dist\MovieHunter.exe") {
            $size = (Get-Item "dist\MovieHunter.exe").Length / 1MB
            Write-Host "✅ EXE size: $([math]::Round($size, 1)) MB"
          } else {
            Write-Error "❌ MovieHunter.exe not found"
            exit 1
          }
        shell: powershell

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieHunter-Windows
          path: dist/MovieHunter.exe
          if-no-files-found: error

      - name: Upload to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          Write-Host "Uploading to tag: $tag"
          gh release upload "$tag" "dist\MovieHunter.exe" --clobber
        shell: powershell