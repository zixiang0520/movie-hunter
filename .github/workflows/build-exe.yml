name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.1)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt
        shell: cmd

      - name: Build EXE
        run: python build_exe.py
        shell: cmd

      - name: Verify EXE
        run: |
          if (Test-Path "dist\MovieHunter.exe") {
            $size = (Get-Item "dist\MovieHunter.exe").Length / 1MB
            Write-Host "EXE size: $([math]::Round($size, 1)) MB"
          } else {
            Write-Error "MovieHunter.exe not found"
            exit 1
          }
        shell: powershell

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieHunter-Windows
          path: dist/MovieHunter.exe
          if-no-files-found: error

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $inputVersion = "${{ github.event.inputs.version }}"

          # Determine tag: use input if provided, else ref_name
          if ($inputVersion -ne "") {
            $tag = "v" + $inputVersion
          }
          if ($tag -eq "") {
            $tag = "v1.0.1"
          }

          # Check if release exists, create if not
          $release = gh release view "$tag" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating release $tag..."
            gh release create "$tag" --title "Movie Hunter $tag" --notes "Auto-generated EXE release"
          }

          Write-Host "Uploading to release $tag..."
          gh release upload "$tag" "dist\MovieHunter.exe" --clobber
        shell: powershell
