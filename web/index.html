<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 Movie Hunter — 影视猎手</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">

  <!-- ── Header ─────────────────────────────────────────────────── -->
  <header class="header">
    <div class="header-inner">
      <div class="brand" id="backBtn" title="返回首页">
        <span class="brand-icon">🎬</span>
        <span class="brand-text">Movie Hunter</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="settingsBtn" title="设置">⚙️</button>
      </div>
    </div>
  </header>

  <!-- ── Main Content ───────────────────────────────────────────── -->
  <main class="main">

    <!-- Search View -->
    <section class="view view-search" id="searchView">
      <div class="hero">
        <h1 class="hero-title">探索你的<span class="hl">影视世界</span></h1>
        <p class="hero-sub">输入电影或电视剧名称，即刻获取详细资料</p>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="搜索电影、电视剧、人物..." autocomplete="off">
          <button id="searchBtn">🔍 搜索</button>
        </div>
        <div id="searchHint" class="hint hidden">按 Enter 快速搜索</div>
      </div>

      <div class="search-results" id="searchResults">
        <div id="resultLoading" class="loading hidden">
          <div class="spinner"></div>
          <span>搜索中...</span>
        </div>
        <div id="resultGrid" class="result-grid"></div>
        <div id="resultError" class="error-msg hidden"></div>
        <div id="resultEmpty" class="empty-msg hidden">没有找到相关结果 😕</div>
      </div>
    </section>

    <!-- Detail View -->
    <section class="view view-detail hidden" id="detailView">
      <div id="detailContent"></div>
    </section>

  </main>

  <!-- ── Password Modal ─────────────────────────────────────────── -->
  <div class="modal-overlay hidden" id="passwordModal">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>🔐 验证身份</h2>
        <button class="modal-close" id="passwordClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="passwordInput">管理员密码</label>
          <input type="password" id="passwordInput" placeholder="请输入管理员密码" autofocus>
        </div>
        <div id="passwordError" class="error-msg hidden"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="passwordCancel">取消</button>
        <button class="btn btn-primary" id="passwordConfirm">确认</button>
      </div>
    </div>
  </div>

  <!-- ── Settings Modal ─────────────────────────────────────────── -->
  <div class="modal-overlay hidden" id="settingsModal">
    <div class="modal">
      <div class="modal-header">
        <h2>⚙️ 设置</h2>
        <button class="modal-close" id="settingsClose">✕</button>
      </div>
      <div class="modal-body">

        <div class="form-group">
          <label for="setApiKey">TMDB API Key <span class="required">*</span></label>
          <div class="input-row">
            <input type="password" id="setApiKey" placeholder="粘贴你的 TMDB API Key">
            <button type="button" class="btn-toggle-visibility" id="toggleApiKey" title="显示/隐藏">👁️</button>
          </div>
          <p class="form-help">可在 <a href="https://www.themoviedb.org/settings/api" target="_blank">TMDB 网站</a> 免费申请</p>
        </div>

        <div class="form-group">
          <label for="setLang">显示语言</label>
          <select id="setLang">
            <option value="zh-CN">简体中文</option>
            <option value="zh-TW">繁体中文</option>
            <option value="en-US">English</option>
            <option value="ja-JP">日本語</option>
            <option value="ko-KR">한국어</option>
          </select>
        </div>

        <div class="divider"></div>

        <div class="form-group">
          <label>代理设置（可选，无法直连 TMDB 时使用）</label>
          <div class="checkbox-row">
            <input type="checkbox" id="setProxyEnabled">
            <label for="setProxyEnabled">启用代理</label>
          </div>
        </div>

        <div class="proxy-grid" id="proxyFields">
          <div class="form-group">
            <label for="setProxyProto">协议</label>
            <select id="setProxyProto">
              <option value="http">HTTP</option>
              <option value="https">HTTPS</option>
              <option value="socks5">SOCKS5</option>
              <option value="socks5h">SOCKS5 (带 DNS)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="setProxyHost">地址</label>
            <input type="text" id="setProxyHost" placeholder="127.0.0.1">
          </div>
          <div class="form-group">
            <label for="setProxyPort">端口</label>
            <input type="number" id="setProxyPort" placeholder="7890" min="1" max="65535">
          </div>
          <div class="form-group">
            <label for="setProxyUser">用户名（可选）</label>
            <input type="text" id="setProxyUser" placeholder="留空则无认证">
          </div>
          <div class="form-group">
            <label for="setProxyPass">密码（可选）</label>
            <input type="password" id="setProxyPass" placeholder="留空则无认证">
          </div>
        </div>

        <div class="divider"></div>
        <div class="form-group">
          <label for="setPassword">修改管理员密码 <span class="optional">(可选)</span></label>
          <input type="password" id="setPassword" placeholder="留空则不修改密码">
          <p class="form-help">填写新密码以修改管理员密码；留空则保留现有密码</p>
        </div>

        <div class="divider"></div>
        <div class="form-group">
          <button class="btn-test" id="testConnection">🔗 测试连接</button>
          <span id="testResult" class="test-result hidden"></span>
        </div>

      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="settingsCancel">取消</button>
        <button class="btn btn-primary" id="settingsSave">💾 保存</button>
      </div>
    </div>
  </div>

  <!-- ── Toast ──────────────────────────────────────────────────── -->
  <div class="toast hidden" id="toast"></div>

</div>

<script src="/static/app.js?v=4"></script>
</body>
</html>
